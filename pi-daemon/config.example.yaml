broker:
  # EMQX Cloud Serverless broker URL (e.g. xxxxxx.emqx.cloud)
  host: "your-deployment-id.emqx.cloud"
  port: 8883 # MQTTS with TLS
  username: "pi_client"
  password: "YourSecurePassword123"
  client_id: "rpi4-edge-daemon"
  use_tls: true

pi:
  device_id: "raspberrypi-4b-01"
  telemetry_interval_sec: 30

plugins:
  web-scraper:
    enabled: true
    mode: "exec" # or "docker"
    command: "/opt/pi-plugins/web-scraper/venv/bin/python /opt/pi-plugins/web-scraper/src/main.py"
    image: "pi-plugin-web-scraper:latest"
    timeout_sec: 180
    work_dir: "/opt/pi-plugins/web-scraper"
    env:
      HEADLESS: "true"

  messaging:
    enabled: true
    mode: "exec"
    command: "node /opt/pi-plugins/messaging/dist/index.js"
    image: "pi-plugin-messaging:latest"
    timeout_sec: 60
    work_dir: "/opt/pi-plugins/messaging"
    env:
      TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"

  pihole:
    enabled: true
    mode: "exec"
    command: "python3 /opt/pi-plugins/pihole/main.py"
    timeout_sec: 60
    work_dir: "/opt/pi-plugins/pihole"
    env:
      PIHOLE_API_URL: "http://127.0.0.1/api"
