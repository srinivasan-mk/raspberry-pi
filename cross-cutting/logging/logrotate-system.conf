# ==============================================================================
# Cross-Cutting Concern: System-Wide Log Rotation Policy
# Copy to /etc/logrotate.d/raspberry-pi-ecosystem
# ==============================================================================

/var/log/pi-daemon/*.log
/var/log/pi-plugins/*.log
/var/log/pihole/*.log
{
    daily
    missingok
    rotate 3
    compress
    delaycompress
    notifempty
    copytruncate
    maxsize 10M
}
